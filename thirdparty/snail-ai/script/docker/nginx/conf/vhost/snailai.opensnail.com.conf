server {
    listen       443 ssl;
    server_name  snailai.opensnail.com;

    ssl_certificate      /etc/nginx/cert/opensnail.com.pem;
    ssl_certificate_key  /etc/nginx/cert/opensnail.com.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.snailai.log;
    error_log  /var/log/nginx/error.snailai.log warn;

    location / {
        root /usr/share/nginx/html/snailai/;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root html; }
}

server {
    listen 80;
    server_name snailai.opensnail.com;
    return 301 https://$host$request_uri;
}
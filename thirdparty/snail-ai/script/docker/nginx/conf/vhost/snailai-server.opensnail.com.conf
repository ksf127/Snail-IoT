upstream snailai-server {
    ip_hash;
    server snail-ai-server:8900;
}

server {
    listen       443 ssl;
    server_name  snailai-server.opensnail.com;

    ssl_certificate      /etc/nginx/cert/opensnail.com.pem;
    ssl_certificate_key  /etc/nginx/cert/opensnail.com.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.snailai-server.log;
    error_log  /var/log/nginx/error.snailai-server.log warn;

    location / {
        # OPTIONS 预检请求直接返回
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Snail-Ai-Auth, Authorization, X-Requested-With, X-Request-Id" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        # 演示模式：仅允许 GET/HEAD/OPTIONS，取消注释即可开启
        # if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        #     return 403;
        # }

        proxy_pass http://snailai-server;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 响应头
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 演示模式错误响应（匹配后端统一格式 Result { status: 0, message: "..." }）
    error_page 403 /demo_forbidden;
    location = /demo_forbidden {
        internal;
        default_type application/json;
        return 200 '{"status":0,"message":"演示模式不允许操作","data":null}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root html; }
}

server {
    listen 80;
    server_name snailai-server.opensnail.com;
    return 301 https://$host$request_uri;
}
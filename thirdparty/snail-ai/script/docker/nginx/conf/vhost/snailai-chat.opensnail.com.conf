upstream snailai-chat {
    ip_hash;
    server snail-ai-agent-example:8081;
}

server {
    listen       443 ssl;
    server_name  snailai-chat.opensnail.com;

    ssl_certificate      /etc/nginx/cert/opensnail.com.pem;
    ssl_certificate_key  /etc/nginx/cert/opensnail.com.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.snailai-chat.log;
    error_log  /var/log/nginx/error.snailai-chat.log warn;

    location / {
        proxy_pass http://snailai-chat;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root html; }
}

server {
    listen 80;
    server_name snailai-chat.opensnail.com;
    return 301 https://$host$request_uri;
}
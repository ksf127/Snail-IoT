worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 100000;
    client_max_body_size 100m;
    client_header_buffer_size 32k;
    client_body_buffer_size   512k;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # 后端服务（compose 内服务名 DNS 解析）
    upstream iot-server {
        server iot-server:8080;
    }

    # 三大控制台 Server（iframe 内嵌）
    upstream iot-sba {
        server iot-sba:9090;
    }
    upstream iot-snailjob {
        server iot-snailjob:8800;
    }
    upstream iot-snailai {
        server iot-snailai:8900;
    }

    # Jenkins 流水线（运行在宿主 Docker Desktop，端口 8090）
    upstream jenkins {
        server host.docker.internal:8090;
    }

    server {
        listen       80;
        server_name  localhost;

        # 限制外网访问内网 actuator 相关路径
        location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
            return 403;
        }

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://iot-server/;
        }

        # ---------------- Spring Boot Admin 监控中心（后端 context-path=/admin） ----------------
        location = /admin {
            return 301 /admin/;
        }
        location /admin/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_pass http://iot-sba;
        }

        # ---------------- SnailJob 任务调度中心（后端 context-path=/snail-job） ----------------
        location = /snail-job {
            return 301 /snail-job/;
        }
        location /snail-job/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_pass http://iot-snailjob;
        }

        # ---------------- SnailAI AI 控制台（后端 context-path=/snail-ai） ----------------
        location = /snail-ai {
            return 301 /snail-ai/;
        }
        location /snail-ai/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_pass http://iot-snailai;
        }

        # ---------------- Jenkins 流水线（构建前后端并发布） ----------------
        # 由 nginx 注入 Basic 认证，前端同源访问，无需暴露 Jenkins 账号
        location /jenkins-api/ {
            proxy_set_header Host localhost:8090;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "Basic YWRtaW46YWRtaW4xMjM=";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_pass http://jenkins/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}

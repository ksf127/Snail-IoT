# ============================================================================
# 应用 · iot-sba（Spring Boot Admin 监控中心，入口 /admin）
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-sba
  namespace: iot-platform
  labels:
    app: iot-sba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-sba
  template:
    metadata:
      labels:
        app: iot-sba
    spec:
      containers:
        - name: iot-sba
          image: iot-platform/monitor-admin:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: TZ
              value: Asia/Shanghai
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: iot-sba
  namespace: iot-platform
spec:
  selector:
    app: iot-sba
  ports:
    - name: http
      port: 9090
      targetPort: 9090

# ============================================================================
# Snail-IoT · 敏感配置
# 与 script/docker/docker-compose.yml 中的默认凭据保持一致；
# 生产环境请替换为真实值（或改用 SealedSecret / 外部密钥管理）。
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: iot-secret
  namespace: iot-platform
type: Opaque
stringData:
  # PostgreSQL（与根 docker-compose.yml 的 ruoyi-postgres 一致）
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: postgres
  # Redis（requirepass）
  REDIS_PASSWORD: "123456"
  # MinIO（与 sys_oss_config 中 config_key=minio 的配置一致）
  MINIO_ROOT_USER: ruoyi
  MINIO_ROOT_PASSWORD: ruoyi123
  # GitHub Personal Access Token（自动化部署-GitHub 项目同步私有仓库用，留空则仅同步公开仓库）
  # 生成方式：GitHub → Settings → Developer settings → Personal access tokens
  GITHUB_TOKEN: ""
